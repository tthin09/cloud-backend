# =============================================================================
# docker-compose.app.yml -- App EC2 stack
# =============================================================================
# Run this file on the App server EC2 instance.
#
# App server private IP: 172.31.24.13
# Monitoring server private IP: 172.31.14.155
#
# Services:
#   1. mysql         -- MySQL 8.0 database, internal Docker network only
#   2. app           -- Node.js demo API (:8081)
#   3. node-exporter -- host system metrics (:9100)
#   4. cadvisor      -- Docker container metrics (:8080)
# =============================================================================

services:
  mysql:
    image: mysql:8.0
    container_name: monitoring-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-monitoring_demo}
      MYSQL_USER: ${DB_USER:-app_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-your_secure_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: monitoring-app
    restart: unless-stopped
    environment:
      PORT: 8081
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-app_user}
      DB_PASSWORD: ${DB_PASSWORD:-your_secure_password}
      DB_NAME: ${DB_NAME:-monitoring_demo}
      METRICS_PREFIX: app_
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-net

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: monitoring-node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - app-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: monitoring-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    networks:
      - app-net

volumes:
  mysql_data:

networks:
  app-net:
    driver: bridge
