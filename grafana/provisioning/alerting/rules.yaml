# =============================================================================
# Grafana Alerting — Alert Rules (Provisioned)
# =============================================================================
# These rules are managed by Grafana's built-in alerting engine (not Alertmanager).
# They will be auto-loaded on Grafana startup.
#
# Severity labels:
#   critical → Telegram immediately
#   warning  → Telegram (grouped, less frequent)
# =============================================================================

apiVersion: 1

groups:
  - orgId: 1
    name: Application Alerts
    folder: AWS Monitoring Alerts
    interval: 1m
    rules:
      # ── 🚨 High Error Rate ──────────────────────────────────────────────
      - uid: alert-high-error-rate
        title: "🚨 High HTTP Error Rate"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: ""
            model:
              expr: sum(rate(app_http_errors_total[5m]))
              instant: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: ""
            model:
              expr: sum(rate(app_http_requests_total[5m]))
              instant: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.1
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: "$A / $B"
              type: math
              refId: C
        noDataState: OK
        execErrState: Alerting
        for: 2m
        annotations:
          summary: "HTTP error rate has exceeded 10% threshold"
          description: "The ratio of HTTP errors to total requests over the last 5 minutes is above 10%. Check application logs and the Application Overview dashboard for details."
        labels:
          severity: critical
          team: backend

      # ── 🐌 High Latency (p95 > 2s) ─────────────────────────────────────
      - uid: alert-high-latency
        title: "🐌 High p95 Latency"
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: ""
            model:
              expr: histogram_quantile(0.95, sum(rate(app_http_request_duration_seconds_bucket[5m])) by (le))
              instant: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 2
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              type: threshold
              refId: B
        noDataState: OK
        execErrState: Alerting
        for: 3m
        annotations:
          summary: "95th percentile response time exceeds 2 seconds"
          description: "The p95 response latency has been above 2 seconds for over 3 minutes. Investigate slow endpoints or database queries."
        labels:
          severity: warning
          team: backend

      # ── 💀 App Down ─────────────────────────────────────────────────────
      - uid: alert-app-down
        title: "💀 Application Down"
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: ""
            model:
              expr: up{job="nodejs-app"}
              instant: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              type: threshold
              refId: B
        noDataState: Alerting
        execErrState: Alerting
        for: 1m
        annotations:
          summary: "Node.js application is unreachable"
          description: "The application scrape target has been down for over 1 minute. The service may have crashed or lost network connectivity."
        labels:
          severity: critical
          team: infra

  - orgId: 1
    name: System Alerts
    folder: AWS Monitoring Alerts
    interval: 1m
    rules:
      # ── 🔥 High CPU Usage ───────────────────────────────────────────────
      - uid: alert-high-cpu
        title: "🔥 High CPU Usage"
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: ""
            model:
              expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
              instant: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 80
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              type: threshold
              refId: B
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "CPU usage exceeds 80%"
          description: "Average CPU usage has been above 80% for 5 minutes. Consider scaling up the instance or investigating CPU-intensive processes."
        labels:
          severity: warning
          team: infra

      # ── 💾 High Memory Usage ────────────────────────────────────────────
      - uid: alert-high-memory
        title: "💾 High Memory Usage"
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: ""
            model:
              expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100
              instant: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 85
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              type: threshold
              refId: B
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "Memory usage exceeds 85%"
          description: "System memory usage has been above 85% for 5 minutes. Consider freeing up memory or scaling the instance."
        labels:
          severity: warning
          team: infra

      # ── 💽 Disk Almost Full ─────────────────────────────────────────────
      - uid: alert-disk-full
        title: "💽 Disk Almost Full"
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: ""
            model:
              expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100
              instant: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 90
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              type: threshold
              refId: B
        noDataState: OK
        execErrState: Alerting
        for: 10m
        annotations:
          summary: "Disk usage exceeds 90%"
          description: "Disk usage has been above 90% for 10 minutes. Clean up old data or expand storage to prevent outage."
        labels:
          severity: critical
          team: infra

  - orgId: 1
    name: Container Alerts
    folder: AWS Monitoring Alerts
    interval: 1m
    rules:
      # ── 🐳 Container High CPU ──────────────────────────────────────────
      - uid: alert-container-high-cpu
        title: "🐳 Container High CPU"
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: ""
            model:
              expr: sum(rate(container_cpu_usage_seconds_total{name!=""}[5m])) by (name) * 100
              instant: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 80
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              type: threshold
              refId: B
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "Container CPU usage exceeds 80%"
          description: "A Docker container's CPU usage has been above 80% for 5 minutes. Check the Container Metrics dashboard."
        labels:
          severity: warning
          team: infra
