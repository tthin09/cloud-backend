# =============================================================================
# alert-rules.yml — Prometheus alerting rules
# =============================================================================
# These rules fire alerts when certain conditions are met.
# Person 3 (Grafana/Alerting) can also define alerts in Grafana,
# but having them here allows Prometheus-native alerting via Alertmanager.
# =============================================================================

groups:
  # ---- Application Alerts ----
  - name: application_alerts
    interval: 30s
    rules:
      # 🚨 High Error Rate: > 10% of requests are errors over 5 minutes
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(app_http_errors_total[5m]))
            /
            sum(rate(app_http_requests_total[5m]))
          ) > 0.1
        for: 2m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "High HTTP error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes (threshold: 10%)."

      # 🐌 High Latency: p95 response time > 2 seconds
      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum(rate(app_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 2
        for: 3m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High p95 latency detected"
          description: "95th percentile response time is {{ $value | humanizeDuration }} (threshold: 2s)."

      # 📈 High Request Rate: sudden spike in traffic
      - alert: HighRequestRate
        expr: sum(rate(app_http_requests_total[1m])) > 100
        for: 2m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Unusually high request rate"
          description: "Request rate is {{ $value | humanize }} req/s (threshold: 100 req/s)."

      # 💀 App Down: no metrics scraped for 1 minute
      - alert: AppDown
        expr: up{job="nodejs-app"} == 0
        for: 1m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "Node.js app is down"
          description: "The nodejs-app scrape target has been unreachable for over 1 minute."

  # ---- System/Infrastructure Alerts (Node Exporter) ----
  - name: system_alerts
    interval: 30s
    rules:
      # 🔥 High CPU Usage: > 80% for 5 minutes
      - alert: HighCPUUsage
        expr: |
          100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value | humanize }}% (threshold: 80%)."

      # 💾 High Memory Usage: > 85%
      - alert: HighMemoryUsage
        expr: |
          (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 85
        for: 5m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is {{ $value | humanize }}% (threshold: 85%)."

      # 💽 Disk Almost Full: > 90%
      - alert: DiskAlmostFull
        expr: |
          (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
               / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 > 90
        for: 10m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "Disk almost full on {{ $labels.instance }}"
          description: "Disk usage on {{ $labels.mountpoint }} is {{ $value | humanize }}% (threshold: 90%)."

  # ---- Container Alerts (cAdvisor) ----
  - name: container_alerts
    interval: 30s
    rules:
      # 🐳 Container restarting frequently
      - alert: ContainerRestartingFrequently
        expr: |
          increase(container_restart_count[15m]) > 3
        for: 5m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "Container {{ $labels.name }} is restarting frequently"
          description: "Container has restarted {{ $value }} times in the last 15 minutes."

      # 🐳 Container high CPU
      - alert: ContainerHighCPU
        expr: |
          sum(rate(container_cpu_usage_seconds_total[5m])) by (name) * 100 > 80
        for: 5m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "Container {{ $labels.name }} has high CPU usage"
          description: "Container CPU usage is {{ $value | humanize }}%."
